<title>우리 교실 전력 일차함수 연구소 (교사용)</title>
<style>
  :root{
    --bg:#f1f6f3; --panel:#ffffff; --panel-2:#f6faf7; --panel-3:#eef4f0;
    --ink:#13251c; --ink-soft:#556b5e; --ink-dim:#82968a;
    --line:#dde8e1; --grid:#e7efe9; --axis:#7d9086;
    --green:#1f7a5a; --green-soft:#e4f2eb;
    --amber:#c9770f; --amber-soft:#fbeeda;
    --blue:#2b6cb0; --violet:#6d5ae0;
    --lock:#9aa8a0;
    --ok:#1f7a5a; --no:#c0392b;
    --shadow:0 1px 2px rgba(19,37,28,.05), 0 8px 26px rgba(19,37,28,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1411; --panel:#151f1a; --panel-2:#1a2620; --panel-3:#1f2c25;
      --ink:#e6f0ea; --ink-soft:#9db0a5; --ink-dim:#7c8f84;
      --line:#26332c; --grid:#22302a; --axis:#7f948a;
      --green:#4dc493; --green-soft:#1b2f26;
      --amber:#e8a552; --amber-soft:#332613;
      --blue:#6fa8e8; --violet:#a394f5;
      --lock:#6b7c73;
      --ok:#4dc493; --no:#ef8377;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --bg:#f1f6f3;--panel:#fff;--panel-2:#f6faf7;--panel-3:#eef4f0;--ink:#13251c;--ink-soft:#556b5e;--ink-dim:#82968a;
    --line:#dde8e1;--grid:#e7efe9;--axis:#7d9086;--green:#1f7a5a;--green-soft:#e4f2eb;--amber:#c9770f;--amber-soft:#fbeeda;
    --blue:#2b6cb0;--violet:#6d5ae0;--lock:#9aa8a0;--ok:#1f7a5a;--no:#c0392b;
    --shadow:0 1px 2px rgba(19,37,28,.05),0 8px 26px rgba(19,37,28,.07);
  }
  :root[data-theme="dark"]{
    --bg:#0d1411;--panel:#151f1a;--panel-2:#1a2620;--panel-3:#1f2c25;--ink:#e6f0ea;--ink-soft:#9db0a5;--ink-dim:#7c8f84;
    --line:#26332c;--grid:#22302a;--axis:#7f948a;--green:#4dc493;--green-soft:#1b2f26;--amber:#e8a552;--amber-soft:#332613;
    --blue:#6fa8e8;--violet:#a394f5;--lock:#6b7c73;--ok:#4dc493;--no:#ef8377;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); line-height:1.55;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--panel);
    border-bottom:1px solid var(--line); padding:8px 14px;
  }
  .topbar-in{max-width:860px; margin:0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .brand{font-size:13.5px; font-weight:800; color:var(--green); letter-spacing:-.01em;}
  .stepchip{
    font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:999px;
    background:var(--green-soft); color:var(--green);
  }
  .badges{display:flex; gap:3px; margin-left:auto;}
  .bdg{width:16px; height:16px; border-radius:50%; background:var(--line); display:grid; place-items:center; font-size:9px;}
  .bdg.on{background:var(--amber); color:#fff;}
  .tb-meta{font-size:11.5px; color:var(--ink-dim);}
  .tb-btn{
    font:inherit; font-size:11.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
    background:transparent; border:1px solid var(--line); border-radius:7px; padding:3px 9px;
  }
  .tb-btn:hover{border-color:var(--green); color:var(--green);}
  .prog{height:3px; background:var(--line); border-radius:2px; margin-top:7px; overflow:hidden;}
  .prog i{display:block; height:100%; background:var(--green); transition:width .35s ease;}

  /* ---------- layout ---------- */
  .wrap{max-width:860px; margin:0 auto; padding:20px 16px 60px;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:20px; margin-bottom:14px;
  }
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:800; color:var(--amber); margin:0 0 6px;}
  h1{font-size:clamp(20px,3.2vw,26px); margin:0 0 8px; letter-spacing:-.015em; text-wrap:balance;}
  h2{font-size:17px; margin:0 0 6px; letter-spacing:-.01em;}
  p{margin:0 0 10px;}
  .lead{color:var(--ink-soft); font-size:14.5px;}
  .small{font-size:13px; color:var(--ink-soft);}
  .center{text-align:center;}

  .q{
    background:var(--amber-soft); border-radius:12px; padding:13px 15px; margin:12px 0;
    font-size:15.5px; font-weight:700; color:var(--ink);
  }
  .note{background:var(--panel-2); border-radius:11px; padding:12px 14px; font-size:13.5px; color:var(--ink-soft); margin:10px 0;}
  .formula{
    font-family:"SF Mono",ui-monospace,Menlo,monospace; font-weight:700;
    font-size:clamp(19px,4vw,25px); text-align:center; padding:14px;
    background:var(--green-soft); border-radius:12px; margin:12px 0; color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .formula .a{color:var(--amber);} .formula .b{color:var(--blue);}

  table{width:100%; border-collapse:collapse; font-size:13.5px; margin:10px 0;}
  th,td{border:1px solid var(--line); padding:7px 9px; text-align:center;}
  th{background:var(--panel-3); font-weight:700; font-size:12.5px;}
  td.num,th.num{font-variant-numeric:tabular-nums;}
  .tw{overflow-x:auto;}

  svg.graph{width:100%; height:auto; display:block; border-radius:10px; background:var(--panel-2);}

  /* ---------- controls ---------- */
  .ctrl{margin:14px 0 4px; position:relative;}
  .ctrl-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:5px;}
  .ctrl-head label{font-size:13.5px; font-weight:700;}
  .val{
    font-family:"SF Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;
    font-size:14px; font-weight:800; padding:2px 10px; border-radius:999px;
  }
  .val.a{color:var(--amber); background:var(--amber-soft);}
  .val.b{color:var(--blue); background:var(--green-soft);}
  input[type=range]{width:100%; margin:0; height:26px; cursor:pointer;}
  input[type=range].sa{accent-color:var(--amber);}
  input[type=range].sb{accent-color:var(--blue);}
  input[type=range]:disabled{cursor:not-allowed; opacity:.45;}
  .locked{
    position:absolute; inset:-6px -8px; border-radius:12px; background:var(--panel-3);
    border:1px dashed var(--lock); display:grid; place-items:center;
    font-size:12.5px; font-weight:700; color:var(--ink-soft); text-align:center; padding:6px;
  }

  input[type=text],input[type=number],select,textarea{
    font:inherit; font-size:14.5px; color:var(--ink); background:var(--panel-2);
    border:1px solid var(--line); border-radius:9px; padding:8px 11px; width:100%;
  }
  input[type=number]{font-variant-numeric:tabular-nums;}
  textarea{min-height:64px; resize:vertical; line-height:1.5;}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,input[type=range]:focus-visible{
    outline:2px solid var(--green); outline-offset:2px;
  }
  .field{margin:10px 0;}
  .field > label{display:block; font-size:13.5px; font-weight:700; margin-bottom:5px;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .row > *{flex:1 1 130px;}
  .inline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14.5px;}
  .inline input[type=number]{width:92px; flex:none;}
  .inline select{width:auto; flex:none;}

  .opts{display:grid; gap:8px; margin:10px 0;}
  .opt{
    display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:11px;
    border:1px solid var(--line); background:var(--panel-2); cursor:pointer; font-size:14.5px;
  }
  .opt:hover{border-color:var(--green);}
  .opt input{margin-top:3px; accent-color:var(--green); flex:none;}
  .opt.sel{border-color:var(--green); background:var(--green-soft);}

  .chk{display:flex; gap:9px; align-items:flex-start; padding:9px 0; font-size:14.5px; cursor:pointer;}
  .chk input{margin-top:4px; accent-color:var(--green); flex:none;}

  button.btn{
    font:inherit; font-size:14.5px; font-weight:700; cursor:pointer; padding:11px 20px; border-radius:11px;
    border:1px solid var(--green); background:var(--green); color:#fff;
  }
  button.btn.ghost{background:transparent; color:var(--green);}
  button.btn:disabled{opacity:.4; cursor:not-allowed;}
  .actions{display:flex; gap:9px; flex-wrap:wrap; margin-top:16px; align-items:center;}

  .fb{margin:10px 0; padding:11px 14px; border-radius:11px; font-size:14px; font-weight:600;}
  .fb.ok{background:var(--green-soft); color:var(--ok);}
  .fb.no{background:var(--amber-soft); color:var(--amber);}
  .fb.info{background:var(--panel-2); color:var(--ink-soft); font-weight:500;}

  .cmp{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0;}
  .cmp > div{padding:11px 13px; border-radius:11px; background:var(--panel-2); font-size:13.5px;}
  .cmp .k{font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); display:block; margin-bottom:3px;}
  .cmp b{font-size:15px;}

  .steps-legend{display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 0;}
  .sl{font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--panel-3); color:var(--ink-dim);}
  .sl.on{background:var(--green); color:#fff;}
  .sl.done{background:var(--green-soft); color:var(--green);}

  .report{border:2px solid var(--green); border-radius:14px; padding:18px; background:var(--panel-2); margin:12px 0;}
  .report h3{margin:0 0 4px; font-size:17px; color:var(--green);}
  .report .rsub{font-size:12.5px; color:var(--ink-soft); margin-bottom:12px;}
  .big{font-size:clamp(22px,5vw,30px); font-weight:800; color:var(--green); font-variant-numeric:tabular-nums;}

  @media (max-width:520px){
    .cmp{grid-template-columns:1fr;}
    .card{padding:16px;}
  }
</style>

<div class="topbar">
  <div class="topbar-in">
    <span class="brand">⚡ 우리 교실 전력 일차함수 연구소</span>
    <span class="stepchip" id="stepchip">입장</span>
    <span class="tb-meta" id="whoami"></span>
    <span class="badges" id="badges"></span>
    <button class="tb-btn" id="btn-demo">🔧 시연</button>
    <button class="tb-btn" id="btn-reset">처음부터</button>
  </div>
  <div class="topbar-in"><div class="prog"><i id="prog"></i></div></div>
</div>

<div class="wrap">
  <div id="screen"></div>
  <div class="steps-legend" id="legend"></div>
</div>

<script>
(function(){
  "use strict";

  /* ============ 상태 ============ */
  var KEY = "power-lf-lab-v1";
  var S = {
    step: 0,
    id: "",
    badges: {},        // r1,r2,r3,mission,report
    pred: {},          // 단계별 예상
    said: {},          // 규칙 문장
    ans: {},           // 문제 답
    plan: {now:5, cut:1, days:20},
    pledge: "",
    proposal: "",
    slogan: "",        // 에너지 다짐 슬로건
    style: 0,          // 포스터 색상
    scene: 0,          // 배경
    hero: 0,           // 주인공 아이콘
    deco: []           // 꾸미기(복수)
  };
  /* 시연 모드 스위치 — 학생 배포본은 false, 교사용은 true */
  var DEMO_ENABLED = true;
  var DKEY = "power-lf-demo";    // 교사 시연 모드
  function isDemo(){ if(!DEMO_ENABLED) return false; try{ return localStorage.getItem(DKEY)==="1"; }catch(e){ return false; } }
  function setDemo(v){ try{ localStorage.setItem(DKEY, v?"1":"0"); }catch(e){} }
  var VKEY = "power-lf-video";   // 교사 설정(영상 링크)은 학생 진행 기록과 따로 보관
  // 기본 동기유발 영상 : 폭염·냉방 전기요금 부담과 전력 수급 뉴스
  var VDEF = "https://www.youtube.com/watch?v=UY_ri2m1e8Q";
  // 한 번도 설정하지 않았으면 기본 영상, 선생님이 비우면(빈 문자열 저장) 영상 없이 진행
  function getVideo(){ try{ var v=localStorage.getItem(VKEY); return v===null ? VDEF : v; }catch(e){ return VDEF; } }
  function setVideo(v){ try{ localStorage.setItem(VKEY, v); }catch(e){} }
  var PKEY = "power-lf-padlet"; // 교사 설정(공유 담벼락 주소)
  var PDEF = "https://padlet.com/nefertari7188/padlet-am2lqmvnupgop7it";
  function getPadlet(){ try{ var v=localStorage.getItem(PKEY); return v===null ? PDEF : v; }catch(e){ return PDEF; } }
  function setPadlet(v){ try{ localStorage.setItem(PKEY, v); }catch(e){} }
  var GKEY = "power-lf-form";   // 교사 설정(활동 결과 제출 폼 주소)
  var GDEF = "https://forms.gle/u7wG5m9tfVofsTpW6";
  function getForm(){ try{ var v=localStorage.getItem(GKEY); return v===null ? GDEF : v; }catch(e){ return GDEF; } }
  function setForm(v){ try{ localStorage.setItem(GKEY, v); }catch(e){} }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  function load(){
    try{ var r = localStorage.getItem(KEY); if(r){ var o=JSON.parse(r); if(o && typeof o==="object") S = Object.assign(S, o); } }catch(e){}
  }

  var A0 = 1.8, B0 = 1.2;   // 에어컨 소비전력, 기본 전력량

  var STEPS = [
    {k:"입장",  t:"연구원 입장"},
    {k:"F",     t:"전력 문제 발견"},
    {k:"O1",    t:"식의 구조"},
    {k:"R1",    t:"변하는 것·고정된 것"},
    {k:"O2",    t:"출발점(y절편)"},
    {k:"R2",    t:"출발점과 평행이동"},
    {k:"O3",    t:"기울기 확인"},
    {k:"R3",    t:"기울기 원리"},
    {k:"통합",  t:"종합 미션"},
    {k:"E1",    t:"전력 절감 제안서"},
    {k:"E2",    t:"에너지 다짐 포스터"},
    {k:"S",     t:"포스터 공유"},
    {k:"T",     t:"실천 다짐과 마무리"}
  ];
  var BADGE_LIST = ["r1","r2","r3","mission","report","poster"];

  /* ============ 유틸 ============ */
  function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
  function $(sel,root){ return (root||document).querySelector(sel); }
  function $$(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function fmt(n){
    var r = Math.round(n*100)/100;
    return (Math.abs(r - Math.round(r)) < 1e-9) ? String(Math.round(r)) : String(r);
  }
  function near(a,b,tol){ return Math.abs(a-b) <= (tol===undefined?0.05:tol); }

  /* ============ 그래프(SVG) ============ */
  function graph(opt){
    var o = Object.assign({
      a:A0, b:B0, xMax:6, yMax:12,
      compare:null,          // {a,b,label}
      intercept:false,       // y절편 강조
      triangle:false,        // 기울기 삼각형
      point:null,            // {x,y,label}
      hline:null             // 목표 전력량 가로선
    }, opt||{});
    var W=440, H=310, padL=48, padR=16, padT=14, padB=40;
    function sx(x){ return padL + (x/o.xMax)*(W-padL-padR); }
    function sy(y){ return H-padB - (Math.min(y,o.yMax)/o.yMax)*(H-padB-padT); }
    var s = '<svg class="graph" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="전기 사용량 그래프">';

    // grid
    s += '<g stroke="var(--grid)" stroke-width="1">';
    for(var i=0;i<=o.xMax;i++){ s+='<line x1="'+sx(i)+'" y1="'+padT+'" x2="'+sx(i)+'" y2="'+(H-padB)+'"/>'; }
    for(var j=0;j<=o.yMax;j+=2){ s+='<line x1="'+padL+'" y1="'+sy(j)+'" x2="'+(W-padR)+'" y2="'+sy(j)+'"/>'; }
    s += '</g>';

    // axes
    s += '<g stroke="var(--axis)" stroke-width="1.6">'
       + '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'"/>'
       + '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(H-padB)+'"/></g>';

    // ticks
    s += '<g fill="var(--ink-dim)" font-size="10" text-anchor="middle">';
    for(var i2=0;i2<=o.xMax;i2++){ s+='<text x="'+sx(i2)+'" y="'+(H-padB+14)+'">'+i2+'</text>'; }
    s += '</g><g fill="var(--ink-dim)" font-size="10" text-anchor="end">';
    for(var j2=0;j2<=o.yMax;j2+=2){ s+='<text x="'+(padL-6)+'" y="'+(sy(j2)+3.5)+'">'+j2+'</text>'; }
    s += '</g>';
    s += '<text x="'+((padL+W-padR)/2)+'" y="'+(H-6)+'" fill="var(--ink-soft)" font-size="10.5" text-anchor="middle">에어컨 사용 시간 (시간)</text>';
    s += '<text x="13" y="'+((padT+H-padB)/2)+'" fill="var(--ink-soft)" font-size="10.5" text-anchor="middle" transform="rotate(-90 13 '+((padT+H-padB)/2)+')">전기 사용량 (kWh)</text>';

    // 목표 가로선
    if(o.hline!=null){
      s += '<line x1="'+padL+'" y1="'+sy(o.hline)+'" x2="'+(W-padR)+'" y2="'+sy(o.hline)+'" stroke="var(--violet)" stroke-width="1.6" stroke-dasharray="5 4"/>'
         + '<text x="'+(W-padR-3)+'" y="'+(sy(o.hline)-6)+'" fill="var(--violet)" font-size="10.5" font-weight="700" text-anchor="end">'+fmt(o.hline)+'kWh</text>';
    }

    // 비교선(점선)
    function lineOf(a,b){
      var yEnd = a*o.xMax + b, xEnd = o.xMax;
      if(yEnd > o.yMax){ xEnd = (o.yMax - b)/a; yEnd = o.yMax; }
      return {x1:sx(0), y1:sy(b), x2:sx(Math.max(0,xEnd)), y2:sy(yEnd)};
    }
    if(o.compare){
      var lc = lineOf(o.compare.a, o.compare.b);
      s += '<line x1="'+lc.x1+'" y1="'+lc.y1+'" x2="'+lc.x2+'" y2="'+lc.y2+'" stroke="var(--violet)" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round"/>';
      if(o.compare.label){
        s += '<text x="'+(lc.x2-4)+'" y="'+(lc.y2-8)+'" fill="var(--violet)" font-size="10.5" font-weight="700" text-anchor="end">'+o.compare.label+'</text>';
      }
    }

    // 기울기 삼각형
    if(o.triangle){
      var x1=1, x2=2, yA=o.a*x1+o.b, yB=o.a*x2+o.b;
      if(yB<=o.yMax){
        s += '<path d="M'+sx(x1)+' '+sy(yA)+' L'+sx(x2)+' '+sy(yA)+' L'+sx(x2)+' '+sy(yB)+' Z" fill="var(--amber)" fill-opacity="0.16" stroke="var(--amber)" stroke-width="1.5"/>'
           + '<text x="'+((sx(x1)+sx(x2))/2)+'" y="'+(sy(yA)+14)+'" fill="var(--amber)" font-size="10.5" font-weight="800" text-anchor="middle">1시간</text>'
           + '<text x="'+(sx(x2)+6)+'" y="'+((sy(yA)+sy(yB))/2+4)+'" fill="var(--amber)" font-size="10.5" font-weight="800">+'+fmt(o.a)+'</text>';
      }
    }

    // 본선
    var ln = lineOf(o.a,o.b);
    s += '<line x1="'+ln.x1+'" y1="'+ln.y1+'" x2="'+ln.x2+'" y2="'+ln.y2+'" stroke="var(--blue)" stroke-width="3.4" stroke-linecap="round"/>';

    // y절편
    if(o.intercept){
      s += '<circle cx="'+sx(0)+'" cy="'+sy(o.b)+'" r="6" fill="var(--green)" stroke="var(--panel)" stroke-width="2.5"/>'
         + '<text x="'+(sx(0)+11)+'" y="'+(sy(o.b)-9)+'" fill="var(--green)" font-size="11.5" font-weight="800">(0, '+fmt(o.b)+')</text>';
    }
    // 임의 점

      ctx.strokeStyle="#e8a300"; ctx.lineWidth=6; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(-16,-16); ctx.lineTo(-6,-34); ctx.lineTo(4,-12); ctx.lineTo(14,-32); ctx.stroke();
      ctx.restore();
    }
    function heroPlug(ctx,x,y,st){
      ctx.save(); ctx.translate(x,y);
      ctx.fillStyle="#ffffff"; ctx.strokeStyle=st.accent; ctx.lineWidth=6;
      rr(ctx,-56,-30,112,84,18); ctx.fill(); ctx.stroke();
      ctx.fillStyle=st.accent;
      rr(ctx,-34,-64,18,40,7); ctx.fill();
      rr(ctx,16,-64,18,40,7); ctx.fill();
      ctx.strokeStyle=st.accent; ctx.lineWidth=8; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(0,54); ctx.quadraticCurveTo(38,84,4,104); ctx.stroke();
      ctx.restore();

    var HERO_FN=[heroAC,heroFan,heroBulb,heroPlug];

    /* --- 배경 --- */
    function sceneClassroom(ctx,st,X,Y,W2,H2){
      ctx.fillStyle="rgba(255,255,255,.62)"; ctx.fillRect(X,Y,W2,H2*0.72);
      ctx.fillStyle=st.accent; ctx.globalAlpha=.18; ctx.fillRect(X,Y+H2*0.72,W2,H2*0.28); ctx.globalAlpha=1;
      var wx=X+W2-152, wy=Y+34;
      ctx.fillStyle=st.sky; rr(ctx,wx,wy,124,120,10); ctx.fill();
      ctx.strokeStyle=st.accent; ctx.lineWidth=7; ctx.stroke();
      ctx.lineWidth=5; ctx.beginPath();
      ctx.moveTo(wx+62,wy); ctx.lineTo(wx+62,wy+120);
      ctx.moveTo(wx,wy+60); ctx.lineTo(wx+124,wy+60); ctx.stroke();
      sunny(ctx,wx+30,wy+28,0.42,"#e8a300");
    }
    function sceneSky(ctx,st,X,Y,W2,H2){
      cloud(ctx,X+82,Y+62,1.0); cloud(ctx,X+W2-78,Y+108,0.8); cloud(ctx,X+150,Y+H2-64,0.7);
      sunny(ctx,X+W2-64,Y+52,0.7,"#e8a300");
    }
    function sceneEarth(ctx,st,X,Y,W2,H2){
      var cx=X+W2/2, cy=Y+H2+150, r=250;
      ctx.fillStyle=st.accent; ctx.globalAlpha=.28;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=.62;
      ctx.beginPath(); ctx.ellipse(cx-100,cy-r+34,52,26,-0.2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx+92,cy-r+52,44,22,0.25,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle=st.accent; ctx.lineWidth=6;
      ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI*1.16,Math.PI*1.84); ctx.stroke();
      cloud(ctx,X+70,Y+56,0.62);
    }
    function sceneForest(ctx,st,X,Y,W2,H2){
      ctx.fillStyle=st.accent; ctx.globalAlpha=.22;
      ctx.beginPath(); ctx.arc(X+90,Y+H2+40,150,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(X+W2-70,Y+H2+56,170,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
      tree(ctx,X+58,Y+H2-92,0.95,st.accent);
      tree(ctx,X+W2-52,Y+H2-78,0.8,st.accent);
      sunny(ctx,X+W2-72,Y+50,0.5,"#e8a300");
    }
    var SCENE_FN=[sceneClassroom,sceneSky,sceneEarth,sceneForest];

    /* --- 조합해서 그리기 --- */
    function drawArt(ctx,st){
      var X=170, Y=392, W2=460, H2=336;
      ctx.save();
      rr(ctx,X,Y,W2,H2,30); ctx.clip();
      ctx.fillStyle=st.sky; ctx.fillRect(X,Y,W2,H2);
      (SCENE_FN[S.scene||0]||SCENE_FN[0])(ctx,st,X,Y,W2,H2);

      var deco=S.deco||[];
      if(deco.indexOf(0)>=0){ leaf(ctx,X+16,Y+62,0.7,0.42,st.accent); leaf(ctx,X+W2-96,Y+H2-52,0.6,-0.5,st.accent); }
      if(deco.indexOf(1)>=0){ wind(ctx,X+72,Y+H2/2+16,1.0,"rgba(255,255,255,.92)"); }
      if(deco.indexOf(2)>=0){ sunny(ctx,X+58,Y+52,0.62,"#e8a300"); }
      if(deco.indexOf(3)>=0){ bolt(ctx,X+W2-58,Y+72,0.72,"#e8a300"); }
      if(deco.indexOf(4)>=0){ tree(ctx,X+42,Y+H2-56,0.62,st.accent); }

      (HERO_FN[S.hero||0]||HERO_FN[0])(ctx,X+W2/2,Y+H2/2+6,st);
      ctx.restore();
      rr(ctx,X,Y,W2,H2,30); ctx.strokeStyle=st.accent; ctx.lineWidth=7; ctx.stroke();
    }
    function drawPoster(){
      var cv=$("#pcv",n); if(!cv) return;
      var ctx=cv.getContext("2d"), W=800, H=1000;
      var st=POSTER_STYLES[S.style||0];
      var slogan=(S.slogan||"").trim() || "우리 교실 에너지 다짐";

      var g=ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,st.bg1); g.addColorStop(1,st.bg2);
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

      ctx.strokeStyle=st.accent; ctx.lineWidth=9; rr(ctx,28,28,W-56,H-56,30); ctx.stroke();

      ctx.textAlign="center";
      ctx.fillStyle=st.accent; ctx.font="bold 27px "+PFONT;
      ctx.fillText("우리 교실 에너지 다짐", W/2, 112);
      ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(W/2-64,134); ctx.lineTo(W/2+64,134); ctx.stroke();

      // 슬로건
      ctx.fillStyle=st.ink;
      var size=64, lines;
      do{
        ctx.font="bold "+size+"px "+PFONT;
        lines=wrapLines(ctx,slogan,W-170);
        if(lines.length<=3) break;
        size-=6;
      } while(size>34);
      var ly=228;
      lines.slice(0,3).forEach(function(L){ ctx.fillText(L,W/2,ly); ly+=size+14; });

      // 학생이 조합한 그림
      drawArt(ctx,st);

      // 절감량
      var bw=470,bh=112,bx=(W-bw)/2,by=756;
      ctx.fillStyle=st.accent; rr(ctx,bx,by,bw,bh,24); ctx.fill();
      ctx.fillStyle="#ffffff"; ctx.font="bold 56px "+PFONT;
      ctx.fillText(fmt(total)+" kWh 절약", W/2, by+58);
      ctx.font="600 22px "+PFONT; ctx.globalAlpha=.92;
      ctx.fillText("하루 "+fmt(cut)+"시간 줄이기 × "+days+"일 실천", W/2, by+92);
      ctx.globalAlpha=1;

      // 근거·학번
      ctx.fillStyle=st.ink; ctx.globalAlpha=.72;
      ctx.font="600 23px "+PFONT;
      ctx.fillText("근거:  y = "+fmt(A0)+"x + "+fmt(B0)+"   (기울기 "+fmt(A0)+" = 1시간당 전력량)", W/2, 912);
      ctx.font="20px "+PFONT;
      ctx.fillText("우리 교실 전력 일차함수 연구소 · 학번 "+(S.id||"-"), W/2, 948);
      ctx.globalAlpha=1;
    }

    function refresh(){
      drawPoster();

      if((S.slogan||"").trim().length<4) miss.push("<b>슬로건</b> 4자 이상 쓰기");

    }

    // 선택 버튼 렌더링
    function paintOpts(){
      function mk(list,attr,cur,multi){
        return list.map(function(o,i){
          var on = multi ? (cur.indexOf(i)>=0) : (cur===i);
          return '<button class="btn ghost" '+attr+'="'+i+'"'
            + (on?' style="background:var(--green);color:#fff;border-color:var(--green)"':'')
            + '>'+(multi&&on?"✓ ":"")+o.name+'</button>';
        }).join("");
      }
      $("#styles",n).innerHTML = mk(POSTER_STYLES,"data-st",S.style||0,false);
      $("#scenes",n).innerHTML = mk(SCENES,"data-sc",S.scene||0,false);
      $("#heros",n).innerHTML  = mk(HEROS,"data-he",S.hero||0,false);
      $("#decos",n).innerHTML  = mk(DECOS,"data-dc",S.deco||[],true);
    }

    var sl=$("#sl",n);
    sl.addEventListener("input",function(){ S.slogan=this.value; save(); refresh(); });
    n.addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b) return;
      if(b.dataset.ex){ sl.value=b.dataset.ex; S.slogan=b.dataset.ex; save(); refresh(); return; }
      if(b.dataset.st!=null){ S.style=parseInt(b.dataset.st,10); save(); paintOpts(); refresh(); return; }
      if(b.dataset.sc!=null){ S.scene=parseInt(b.dataset.sc,10); save(); paintOpts(); refresh(); return; }
      if(b.dataset.he!=null){ S.hero=parseInt(b.dataset.he,10); save(); paintOpts(); refresh(); return; }
      if(b.dataset.dc!=null){
        var i=parseInt(b.dataset.dc,10);

        var k=S.deco.indexOf(i);
        if(k>=0) S.deco.splice(k,1); else S.deco.push(i);
        save(); paintOpts(); refresh(); return;

    paintOpts();

    // PNG 저장
    var dl=$("#dl",n), dlfb=$("#dlfb",n);
    if(!canSave){
      dl.style.display="none";
      dlfb.textContent="이 화면에서는 저장이 지원되지 않습니다. 포스터를 화면 캡처해 사용하세요.";
    } else {
      dl.addEventListener("click",function(){
        var cv=$("#pcv",n);
        dlfb.style.color="var(--ink-soft)"; dlfb.textContent="저장 준비 중…";
        cv.toBlob(function(blob){
          if(!blob){ dlfb.textContent="이미지를 만들지 못했습니다. 화면 캡처를 이용하세요."; return; }
          window.claude.downloads.save({filename:"energy-pledge-poster.png", data:blob})
            .then(function(){

              dlfb.textContent="✓ 저장되었습니다. (energy-pledge-poster.png)";
              award("poster"); refresh();
            })
            .catch(function(err){
              var c=(err&&err.code)||"unavailable";
              dlfb.style.color="var(--amber)";
              if(c==="declined") dlfb.textContent="저장을 취소했습니다.";
              else if(c==="rate_limited") dlfb.textContent="잠시 후 다시 눌러 주세요.";
              else if(c==="too_large") dlfb.textContent="파일이 너무 큽니다.";
              else {
                dl.style.display="none";
                dlfb.textContent="저장이 지원되지 않습니다. 화면 캡처를 이용하세요.";
                canSave=false;
              }
              // 두 번 실패하면 화면 캡처로 대신하도록 잠금을 풀어 준다
              var t=(parseInt(n.dataset.dltry||"0",10))+1; n.dataset.dltry=String(t);
              if(t>=2 && canSave){
                canSave=false;
                dlfb.textContent="저장이 잘 되지 않네요. 포스터를 화면 캡처해 사용하고 다음 단계로 넘어가세요.";
              }
              refresh();
            });
        },"image/png");
      });
    }

    $("#next",n).addEventListener("click",function(){ award("poster"); goto(11); });
    refresh();
    return n;
  };

      L.push("");
      L.push("■ 내가 발견한 규칙");
      L.push("1) 평행이동: "+((S.said.r1||"").trim()||"(미작성)"));
      L.push("2) 출발점(y절편): "+((S.said.r2||"").trim()||"(미작성)"));
      L.push("3) 기울기: "+((S.said.r3||"").trim()||"(미작성)"));
      L.push("");
      L.push("■ 절전 계산");
      L.push("현재 "+fmt(S.plan.now)+"시간 → "+fmt(Math.max(0,S.plan.now-S.plan.cut))+"시간 ("+fmt(S.plan.cut)+"시간 줄이기)");
      L.push("하루 절감량: "+fmt(perDay)+" kWh");
      L.push(S.plan.days+"일 실천 시 총 절감량: "+fmt(total)+" kWh");
      L.push("");
      L.push("■ 우리 모둠의 제안");
      L.push((S.proposal||"").trim()||"(미작성)");
      L.push("");
      L.push("■ 에너지 다짐 슬로건");
      L.push((S.slogan||"").trim()||"(미작성)");
      L.push("포스터 구성: 배경 "+(SCENES[S.scene||0]||{}).name
        + " / 주인공 "+(HEROS[S.hero||0]||{}).name
        + " / 꾸미기 "+((S.deco||[]).map(function(i){return (DECOS[i]||{}).name;}).filter(Boolean).join("·")||"없음"));
      L.push("(포스터 이미지 energy-pledge-poster.png 는 학급 담벼락에 올림)");
      L.push("");
      L.push("■ 나의 실천 다짐");
      L.push((pl?pl.value.trim():"")||"(미작성)");
      L.push("");
      L.push("■ 획득 배지: "+BADGE_LIST.filter(function(k){return S.badges[k];}).length+" / "+BADGE_LIST.length);
      return L.join("\n");
    }
    function refresh(){ sum.value = buildSummary(); }

    function paintForm(){
      var u=getForm().trim(), box=$("#fbox",n);
      if(/^https?:\/\//i.test(u)){
        var safe=u.split(String.fromCharCode(34)).join("").split("'").join("");
        box.innerHTML='<div class="note" style="text-align:center;border:1px solid var(--line)">'
          + '<div style="font-size:32px;line-height:1">📝</div>'
          + '<p style="margin:8px 0 12px">복사한 요약을 <b>제출 폼</b>에 붙여 넣으세요.</p>'
          + '<a class="btn" style="display:inline-block;text-decoration:none" '
          + 'target="_blank" rel="noopener noreferrer" href="'+safe+'">🔗 제출 폼 열기 (새 창)</a>'
          + '<p class="small" style="margin:10px 0 0">폼에도 <b>이름 대신 학번</b>을 씁니다.</p></div>';
      } else {
        box.innerHTML='<div class="note" style="text-align:center">'
          + '<div style="font-size:28px;line-height:1;opacity:.6">📝</div>'
          + '<p class="small" style="margin:8px 0 0">선생님이 제출 폼 주소를 설정하면 여기에 <b>제출 폼 열기</b> 버튼이 표시됩니다.</p></div>';
      }
    }
    var furl=$("#furl",n);
    furl.value=getForm();
    furl.addEventListener("input",function(){ setForm(this.value.trim()); paintForm(); });
    $("#freset",n).addEventListener("click",function(){ setForm(GDEF); furl.value=GDEF; paintForm(); });
    paintForm();

    function chk(){ fin.disabled = pl.value.trim().length<5; }
    pl.addEventListener("input",function(){ chk(); refresh(); });
    chk(); refresh();

    fin.addEventListener("click",function(){
      S.pledge=pl.value.trim(); save(); refresh();
      $("#done",n).innerHTML='<div class="fb ok">🌳 연구를 모두 마쳤습니다! 수학이 교실의 전기를 줄이는 근거가 되었습니다.</div>';
      fin.disabled=true; fin.textContent="완료 ✓";
    });

    $("#cp",n).addEventListener("click",function(){
      var fb=$("#cpfb",n);
      refresh();
      function done(){ fb.textContent="✓ 복사되었습니다. 아래 제출 폼을 열어 붙여 넣으세요."; fb.style.color="var(--ok)"; }
      function fail(){ fb.textContent="복사가 안 되면 위 내용을 직접 선택해 복사하세요."; fb.style.color="var(--amber)"; }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(sum.value).then(done).catch(function(){
          try{ sum.select(); document.execCommand("copy"); done(); }catch(e){ fail(); }
        });
      } else {
        try{ sum.select(); document.execCommand("copy"); done(); }catch(e){ fail(); }
      }
    });
    $("#again",n).addEventListener("click",reset);
    return n;
  };

  /* ============ 상단바 · 진행 ============ */
  function paintTop(){
    var st=STEPS[S.step]||STEPS[0];
    $("#stepchip").textContent = st.k+" · "+st.t;
    $("#whoami").textContent = S.id ? ("학번 "+S.id) : "";
    $("#prog").style.width = Math.round(S.step/(STEPS.length-1)*100)+"%";
    $("#badges").innerHTML = BADGE_LIST.map(function(k){
      return '<span class="bdg'+(S.badges[k]?" on":"")+'" title="'+k+'">'+(S.badges[k]?"★":"")+'</span>';
    }).join("");
    $("#legend").innerHTML = STEPS.map(function(s,i){
      var c = i===S.step?"sl on":(i<S.step?"sl done":"sl");
      return '<span class="'+c+'" data-go="'+i+'" title="'+s.t+' 로 이동" '
        + 'style="cursor:pointer">'+s.k+'</span>';
    }).join("");
    var db=$("#btn-demo");
    if(!DEMO_ENABLED){ db.style.display="none"; }
    else if(isDemo()){ db.style.background="var(--amber)"; db.style.color="#fff"; db.style.borderColor="var(--amber)"; }
    else { db.removeAttribute("style"); }
  }

  /* 교사 시연 모드: 정답을 미리 채우고 잠금을 풀어 빠르게 넘길 수 있게 함 */
  function applyDemo(){
    if(!DEMO_ENABLED || !isDemo()) return;
    var host=$("#screen");
    function q(sel){ return host.querySelector(sel); }
    // 예상값 기본 세팅(학생 기록에는 저장하지 않음)
    if(!S.pred.r1) S.pred.r1="ac";
    if(S.pred.r2==null) S.pred.r2=2.6;
    if(!S.pred.r3) S.pred.r3="steep";
    if(S.pred.f==null) S.pred.f=2;
    if(!S.id) S.id="시연";
    // 숨은 영역 펼치기
    ["#after","#m2","#m3"].forEach(function(sel){ var e=q(sel); if(e) e.style.display="block"; });
    // 정답 미리 채우기
    var vals={"#rid":"시연","#p0":2,"#c1":5.4,"#c2":1.2,"#c3":6.6,
              "#q1":1.2,"#q2":0.5,"#q3":8.7,"#ma":0.5,"#mb":1.2,"#mp":3.2,"#mr":5};
    Object.keys(vals).forEach(function(sel){
      var e=q(sel); if(e && !e.value){ e.value=vals[sel]; e.dispatchEvent(new Event("input",{bubbles:true})); }
    });
    var texts={"#say1":"기본 전기량은 출발점만 바꾸므로 기울어진 정도는 변하지 않는다.",
               "#say2":"x가 0이면 1.8×0=0이므로 남는 값 b가 출발점이 된다.",
               "#say3":"소비전력은 1시간마다 늘어나는 양이므로 커지면 그래프가 더 빨리 올라간다.",
               "#prop":"점심시간에는 에어컨을 끄고 창문을 열어 하루 1시간을 줄이자.",
               "#pl":"냉방 중에는 창문을 닫고, 점심시간에는 전원을 끄겠습니다.",
               "#sl":"한 시간 덜 켜면 지구가 웃어요"};
    Object.keys(texts).forEach(function(sel){
      var e=q(sel); if(e && !e.value){ e.value=texts[sel]; e.dispatchEvent(new Event("input",{bubbles:true})); }
    });
    // 드롭다운·라디오·체크박스
    [["#w1",["ac","b","steep"]],["#w2",["base","shift","same"]]].forEach(function(p){
      var e=q(p[0]); if(!e) return;
      for(var i=0;i<p[1].length;i++){
        var has=Array.prototype.some.call(e.options,function(o){ return o.value===p[1][i]; });
        if(has){ e.value=p[1][i]; e.dispatchEvent(new Event("change",{bubbles:true})); break; }
      }
    });
    [["p1","ac"],["p3","steep"]].forEach(function(p){
      var r=host.querySelector('input[name='+p[0]+'][value='+p[1]+']');
      if(r && !r.checked){ r.checked=true; r.dispatchEvent(new Event("change",{bubbles:true})); }
    });
    Array.prototype.forEach.call(host.querySelectorAll(".pact"),function(c){
      if(!c.checked){ c.checked=true; c.dispatchEvent(new Event("change",{bubbles:true})); }
    });
    // 슬라이더 갱신
    ["#sb","#sa","#sx"].forEach(function(sel){
      var e=q(sel); if(e) e.dispatchEvent(new Event("input",{bubbles:true}));
    });
    // 남은 잠금 해제
    ["#next","#start","#fin"].forEach(function(sel){
      var b=q(sel); if(b) b.disabled=false;
    });
    var g=q("#gatemsg");
    if(g) g.innerHTML='<div class="fb info">🔧 <b>시연 모드</b> — 정답이 미리 채워지고 잠금이 해제되었습니다. '
      + '아래 단계 표시를 눌러 원하는 화면으로 바로 이동할 수 있습니다.</div>';
  }

  function render(){
    var host=$("#screen");
    host.innerHTML="";
    host.appendChild(screens[S.step]());
    paintTop();
    applyDemo();
  }

  function reset(){
    S={step:0,id:"",badges:{},pred:{},said:{},ans:{},plan:{now:5,cut:1,days:20},pledge:"",proposal:"",slogan:"",style:0,scene:0,hero:0,deco:[]};
    save(); render(); window.scrollTo({top:0,behavior:"smooth"});
  }
  $("#btn-reset").addEventListener("click",function(){
    if(confirm("모든 기록을 지우고 처음부터 다시 시작할까요?")) reset();
  });
  $("#btn-demo").addEventListener("click",function(){
    setDemo(!isDemo());
    render();
  });
  // 단계 표시를 눌러 바로 이동
  $("#legend").addEventListener("click",function(e){
    var t=e.target.closest("[data-go]"); if(!t) return;
    var i=parseInt(t.dataset.go,10);
    if(i===S.step) return;
    if(i>S.step && !isDemo()){
      if(!confirm("아직 지나지 않은 단계입니다. 그래도 이동할까요?\n(🔧 시연 모드를 켜면 정답이 미리 채워집니다.)")) return;
    }
    goto(i);
  });

  /* 테마 변경 시 그래프 색 갱신 */
  var mq=window.matchMedia("(prefers-color-scheme: dark)");
  if(mq.addEventListener) mq.addEventListener("change",render);
  new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

  load(); render();
})();
</script>
